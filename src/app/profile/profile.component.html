<app-shared-header
  [showLogout]="true"
  (logout)="onLogout()"
></app-shared-header>
<div class="profile-bg">
  <h2 class="profile-title">User Profile</h2>
  <div *ngIf="userInfo && !userInfo.error; else errorBlock">
    <table class="profile-table">
      <tr>
        <th>Name</th>
        <td>{{ userInfo.name || userInfo.nickname }}</td>
      </tr>
      <tr>
        <th>Email</th>
        <td>{{ userInfo.email }}</td>
      </tr>
      <tr>
        <th>Subject</th>
        <td>{{ userInfo.sub }}</td>
      </tr>
      <tr>
        <th>Issued At</th>
        <td>{{ userInfo.iat }}</td>
      </tr>
      <tr>
        <th>Expires At</th>
        <td>{{ userInfo.exp }}</td>
      </tr>
    </table>
  </div>
  <ng-template #errorBlock>
    <div class="profile-error">{{ userInfo.error }}</div>
  </ng-template>
</div>
<!-- Generated by AIG Copilot - end -->

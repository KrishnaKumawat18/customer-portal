<!-- Generated by AIG Copilot - start -->
<app-shared-header [showLogout]="true" (logout)="logout()"></app-shared-header>
<div class="payment-bg">
  <h2 class="payment-title">Payment / お支払い</h2>
  <div class="payment-content">
    <ng-container *ngIf="!showNewPaymentForm; else newPaymentForm">
      <table class="payment-table">
        <thead>
          <tr>
            <th>Payment #</th>
            <th>Bill #<br />請求書番号</th>
            <th>Date<br />支払日</th>
            <th>Method<br />方法</th>
            <th>Amount<br />金額</th>
            <th>Status<br />状況</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>PMT-2025-02</td>
            <td>BILL-2025-01</td>
            <td>2025-06-05</td>
            <td>Credit Card</td>
            <td>¥8,000</td>
            <td>Completed</td>
          </tr>
          <tr>
            <td>PMT-2025-01</td>
            <td>BILL-2025-00</td>
            <td>2025-05-05</td>
            <td>Bank Transfer</td>
            <td>¥12,000</td>
            <td>Completed</td>
          </tr>
        </tbody>
      </table>
    </ng-container>
    <ng-template #newPaymentForm>
      <h3 style="margin-bottom: 1.5rem">New Payment / 新規支払い</h3>
      <form (ngSubmit)="onSubmitNewPayment()" #paymentForm="ngForm">
        <div style="margin-bottom: 1rem">
          <label for="policyId">Policy ID:</label>
          <input
            id="policyId"
            type="text"
            [(ngModel)]="newPayment.policyId"
            name="policyId"
            required
          />
        </div>
        <div style="margin-bottom: 1rem">
          <label for="method">Method:</label>
          <input
            id="method"
            type="text"
            [(ngModel)]="newPayment.method"
            name="method"
            required
          />
        </div>
        <div style="margin-bottom: 1rem">
          <label for="amount">Amount:</label>
          <input
            id="amount"
            type="number"
            [(ngModel)]="newPayment.amount"
            name="amount"
            required
          />
        </div>
        <div style="margin-bottom: 1rem">
          <label for="date">Date:</label>
          <input
            id="date"
            type="date"
            [(ngModel)]="newPayment.date"
            name="date"
            required
          />
        </div>
        <div style="margin-bottom: 1rem">
          <label for="remarks">Remarks:</label>
          <textarea
            id="remarks"
            [(ngModel)]="newPayment.remarks"
            name="remarks"
          ></textarea>
        </div>
        <button
          class="payment-action-btn"
          type="submit"
          [disabled]="!paymentForm.form.valid"
        >
          Submit Payment / 申請
        </button>
        <button
          class="payment-action-btn"
          type="button"
          (click)="onCancelNewPayment()"
          style="margin-left: 1rem"
        >
          Cancel / キャンセル
        </button>
      </form>
    </ng-template>
  </div>
</div>
<!-- Generated by AIG Copilot - end -->

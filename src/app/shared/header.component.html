<header class="dashboard-header">
  <div class="dashboard-header-content">
    <div
      class="dashboard-logo"
      style="cursor: pointer"
      (click)="navigateDashboard()"
      title="ダッシュボード"
    >
      Customer Portal<br />
      <span class="dashboard-logo-jp">カスタマーポータル</span>
    </div>
    <div class="dashboard-header-actions">
      <!-- Dashboard home link removed, logo is now clickable -->
      <!-- Logout button removed, now only in avatar menu -->
    </div>
    <div class="dashboard-welcome">
      <ng-container *ngIf="userName; else guest">
        ようこそ、{{ userName }} 様
        <span
          style="margin-left: 1rem"
          class="dashboard-user-avatar"
          title="User"
          (mouseenter)="openUserMenu()"
          (mouseleave)="closeUserMenu()"
          [class.active]="userMenuOpen"
        >
          <img
            src="assets/avatar-default.svg"
            alt="User Avatar"
            class="dashboard-user-avatar-img"
          />
          <div class="dashboard-user-menu" *ngIf="userMenuOpen">
            <button class="dashboard-user-menu-item" (click)="goToProfile()">
              Profile
            </button>
            <button class="dashboard-user-menu-item" (click)="goToSettings()">
              Settings
            </button>
            <button class="dashboard-user-menu-item" (click)="onLogoutMenu()">
              Logout
            </button>
          </div>
        </span>
      </ng-container>
      <ng-template #guest>ようこそ、ユーザー 様！</ng-template>
    </div>
  </div>
</header>
<!-- Generated by AIG Copilot - end -->
